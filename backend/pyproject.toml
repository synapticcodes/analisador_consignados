[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calculadora-consignados-backend"
version = "1.0.0"
description = "Backend API para extração e cálculo de indicadores financeiros de PDFs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Calculadora Consignados Team"}
]
keywords = ["fastapi", "pdf", "consignado", "llm", "extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    # Web Framework
    "fastapi[standard]==0.128.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",

    # Data Validation & Serialization
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",

    # Redis & Caching
    "redis>=5.2.1",
    "hiredis>=3.0.0",

    # Celery (Background Tasks)
    "celery[redis]>=5.4.0",
    "kombu>=5.4.2",

    # S3/MinIO Storage
    "boto3>=1.35.90",
    "aioboto3>=13.3.0",

    # PDF Processing
    "PyMuPDF>=1.25.3",
    "pdfplumber>=0.11.4",
    "pypdf>=5.1.0",

    # OCR (optional)
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",

    # LLM & Embeddings
    "openai>=1.59.5",
    "tiktoken>=0.8.0",

    # Vector Database
    "qdrant-client>=1.12.1",

    # HTTP Client
    "httpx>=0.28.1",
    "aiohttp>=3.11.11",

    # Date/Time
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",

    # Utilities
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "orjson>=3.10.14",

    # Observability
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "prometheus-client>=0.21.1",

    # Security
    "cryptography>=44.0.0",

    # Regex & Text Processing
    "regex>=2024.11.6",

    # NER for PII Redaction
    "spacy>=3.8.3",

    # Logging
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-env>=1.1.5",
    "httpx>=0.28.1",
    "faker>=34.0.0",

    # Code Quality
    "ruff>=0.9.1",
    "black>=24.12.0",
    "isort>=5.13.2",
    "mypy>=1.14.1",
    "pylint>=3.3.3",

    # Type Stubs
    "types-python-dateutil>=2.9.0",
    "types-pytz>=2024.2",
    "types-pyyaml>=6.0.12",
    "types-redis>=4.6.0",

    # Development Tools
    "ipython>=8.31.0",
    "ipdb>=0.13.13",
]

prod = [
    # Production Server
    "gunicorn>=23.0.0",

    # Error Tracking
    "sentry-sdk[fastapi]>=2.19.2",
]

[project.urls]
Homepage = "https://github.com/seu-org/calculadora-consignados"
Documentation = "https://github.com/seu-org/calculadora-consignados/docs"
Repository = "https://github.com/seu-org/calculadora-consignados"
Issues = "https://github.com/seu-org/calculadora-consignados/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=html",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=60",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "llm: Tests that call LLM APIs",
]
env = [
    "ENVIRONMENT=test",
    "DATABASE_URL=postgresql+asyncpg://postgres:test@localhost:5432/test_db",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/alembic/*", "*/venv/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "fitz.*",
    "pdfplumber.*",
    "qdrant_client.*",
]
ignore_missing_imports = true
